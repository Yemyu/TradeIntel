<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究解释人工审阅</title><style>body{font:17px/1.7 system-ui;background:#f3f6fa;color:#183047}main{max-width:900px;margin:auto;padding:24px}article{background:white;padding:20px;margin:20px 0;border-radius:10px}textarea{display:block;width:95%;min-height:85px;font:inherit}select,input,button{font:inherit;padding:8px}blockquote{border-left:3px solid #789;padding-left:15px;margin-left:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.warn{background:#fff0cd;padding:16px}a{color:#155b99}</style></head><body><main>
<a href="/">返回首页</a> · <a id="source-link" href="/demo/research-review" target="_blank" rel="noopener">先看数据、原文及助手意见</a>
<h1>审阅本次 AI 建议</h1><p id="run-label"></p><p class="warn">这是你对所选运行回答的审阅，不是案例发布批准。每条必须选择并说明理由；没有预选“采纳”。每次修订另存为新版本，旧决定和原模型文字都会保留。本地审阅标签不代表经过身份认证或专业资质认证。</p>
<p id="data-report"></p>
<p id="status" role="status">正在读取…</p><p id="boundary" class="warn">审阅稿即使可以查看，也不等于案例发布批准；案例状态不会由本页自动改变。</p><div id="notes"></div>
<label>审阅者标签（只需本地代号，不用真实姓名）<input id="reviewer" maxlength="80"></label>
<p><label><input id="facts" type="checkbox">我已对照来源资料核查本次数据与政策事实（不是只看AI文字）</label></p>
<p id="change-box" hidden><label>本次修订原因<textarea id="change-reason" maxlength="1000"></textarea></label></p>
<button id="revise" hidden>修订审阅决定</button><button id="cancel-revision" hidden>取消修订</button>
<button id="save" disabled>保存本次审阅决定（不发布案例）</button><p id="export"></p><pre id="record"></pre><details><summary>审阅历史</summary><pre id="history"></pre></details>
<script>
'use strict';let current;let editingRevision=false;const el=id=>document.getElementById(id);
const params=new URLSearchParams(window.location.search);
const selectedRun=params.get('run_id');
const validSelector=Array.from(params.keys()).every(k=>k==='run_id')&&params.getAll('run_id').length<=1&&(!params.has('run_id')||/^exposure-\d{8}T\d{6}-[0-9a-f]{8}$/.test(selectedRun));
const suffix=selectedRun?'?run_id='+encodeURIComponent(selectedRun):'';
const reviewEndpoint='/api/saved-interpretation-review'+suffix;
const draftEndpoint='/api/saved-interpretation-draft'+suffix;
el('run-label').textContent=selectedRun&&validSelector?'当前运行：'+selectedRun:'固定开发案例存档';
if(selectedRun&&validSelector){el('source-link').href='/api/research-artifact/'+selectedRun+'/source-packet.zh-CN.md';el('source-link').textContent='查看本次来源资料';}

async function load(){editingRevision=false;el('revise').hidden=true;el('cancel-revision').hidden=true;el('change-box').hidden=true;el('change-reason').value='';el('export').replaceChildren();el('record').textContent='';el('save').disabled=true;try{const response=await fetch(reviewEndpoint);const data=await response.json();if(!response.ok)throw Error(data.message);current=data;el('notes').replaceChildren();el('history').textContent=JSON.stringify(data.history||[],null,2);
el('data-report').replaceChildren();
if(data.data_report){const b=data.data_report;el('data-report').textContent=b.message;if(b.status==='bound'&&typeof b.url==='string'&&/^\/api\/version-report\?version=[0-9a-f]{64}$/.test(b.url)){const a=document.createElement('a');a.href=b.url;a.textContent=' 查看同版本数据';a.target='_blank';a.rel='noopener';el('data-report').append(a);}}
if(data.status==='stale'){
el('status').textContent='资料版本已变化，旧审阅已过期。';
el('boundary').textContent='旧决定不能应用于当前建议，审阅稿暂不可导出。旧记录保留在下方供追溯；当前页面尚不支持重新审阅。';
el('reviewer').value='';el('reviewer').disabled=true;el('facts').checked=false;el('facts').disabled=true;
el('record').textContent='旧版本记录（不适用于当前资料）：\n'+JSON.stringify(data.decision,null,2);
return;
}
data.notes.forEach((note,index)=>{const article=document.createElement('article');const title=document.createElement('h2');title.textContent='建议 '+(index+1);const quote=document.createElement('blockquote');quote.textContent=note.text;const refs=document.createElement('p');refs.textContent='关联事实：'+note.fact_ids.join(', ');const select=document.createElement('select');select.id='verdict-'+index;select.setAttribute('aria-label','建议 '+(index+1)+' 的决定');for(const [value,label] of [['','请选择'],['accept','采纳为待审阅稿素材'],['reject','不采纳'],['needs_revision','需要修改']]){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option);}const reason=document.createElement('textarea');reason.id='reason-'+index;reason.maxLength=1000;reason.placeholder='说明证据与理由，不能只填“同意”';reason.setAttribute('aria-label','建议 '+(index+1)+' 的审阅理由');const saved=data.decision&&data.decision.decisions&&data.decision.decisions[index];if(saved){select.value=saved.verdict;reason.value=saved.reason;select.disabled=true;reason.disabled=true;}article.append(title,quote,refs,select,reason);el('notes').append(article);});
el('revise').hidden=data.status!=='recorded';el('status').textContent='审阅状态：'+data.status+'；审阅版本：'+(data.revision||0)+'。';el('save').disabled=data.status!=='pending';el('reviewer').disabled=data.status!=='pending';el('facts').disabled=data.status!=='pending';if(data.decision){el('reviewer').value=data.decision.reviewer||'';el('facts').checked=data.decision.facts_checked===true;el('boundary').textContent=data.decision.eligible_for_reviewed_draft?'审阅已记录。下面的审阅稿只含采纳项，仍不是案例发布批准。':'审阅已记录，但当前不满足审阅稿导出条件；可通过修订重新审阅，仍不是案例发布批准。';el('record').textContent=JSON.stringify(data.decision,null,2);if(data.status==='recorded'&&data.decision.eligible_for_reviewed_draft===true){const link=document.createElement('a');link.href=draftEndpoint;link.textContent='下载/查看人工审阅稿（只含采纳项；不发布案例）';link.target='_blank';link.rel='noopener';el('export').append(link);}}
}catch(error){el('status').textContent=error.message;el('save').disabled=true;}}
el('revise').addEventListener('click',()=>{
if(!current||current.status!=='recorded')return;
editingRevision=true;el('export').replaceChildren();el('revise').hidden=true;
el('cancel-revision').hidden=false;el('change-box').hidden=false;
el('reviewer').disabled=false;el('facts').disabled=false;el('facts').checked=false;
current.notes.forEach((_,index)=>{el('verdict-'+index).disabled=false;el('reason-'+index).disabled=false;});
el('save').disabled=false;el('status').textContent='正在修订第'+current.revision+'版；请重新核查事实并说明改动原因。';
});
el('cancel-revision').addEventListener('click',()=>load());
el('save').addEventListener('click',async()=>{const decisions=current.notes.map((_,index)=>({index,verdict:el('verdict-'+index).value,reason:el('reason-'+index).value.trim()}));if(!el('reviewer').value.trim()||decisions.some(d=>!d.verdict||!d.reason)){el('status').textContent='请填写审阅者标签、每项决定和理由。';return;}if(editingRevision&&!el('change-reason').value.trim()){el('status').textContent='请填写本次修订原因。';return;}if(!confirm('保存一个新的审阅版本？旧决定与原回答都会保留。'))return;el('save').disabled=true;try{const response=await fetch(reviewEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fingerprint:current.fingerprint,reviewer:el('reviewer').value.trim(),facts_checked:el('facts').checked,decisions,...(editingRevision?{base_review_digest:current.review_digest,change_reason:el('change-reason').value.trim()}:{})})});const data=await response.json();if(!response.ok)throw Error(data.message);await load();}catch(error){el('status').textContent=error.message;el('save').disabled=false;}});if(validSelector){load();}else{el('status').textContent='运行编号无效，请从研究结果入口重新打开。';el('save').disabled=true;}
</script></main></body></html>
